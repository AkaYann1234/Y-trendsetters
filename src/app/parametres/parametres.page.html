<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Paramètres</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="full">
    <ion-list-header><ion-label>Préférences</ion-label></ion-list-header>
    
    <ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-label>Mode Sombre</ion-label>
      <ion-toggle [(ngModel)]="darkMode" (ionChange)="toggleDarkMode()"></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Notifications</ion-label>
      <ion-toggle [(ngModel)]="notifications"></ion-toggle>
    </ion-item>

    <ion-list-header><ion-label>Application</ion-label></ion-list-header>

    <ion-item button (click)="allerAPropos()">
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label>À propos</ion-label>
    </ion-item>

    <ion-item button (click)="Securite()">
      <ion-icon slot="start" name="key-outline"></ion-icon>
      <ion-label>Gestion de sécurité</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
