<ion-header [translucent]="true">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header> 
  <ion-list>
    <ion-item>
      <ion-label position="floating">E-mail</ion-label>
    <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Mot de passe</ion-label>
    <ion-input [type]="isPasswordVisible ? 'text' : 'password'" [(ngModel)]="mdp" name="mdp"></ion-input>
    
  </ion-item>
  <ion-note *ngIf="mdp.length > 0 && mdp.length < 6" color="danger" style="padding-left: 16px;">
      Minimum 6 caractères
    </ion-note>
  </ion-list>
  <ion-button expand="block" class="ion-margin-top" (click)="onLogin()">LOGIN</ion-button>
  <div class="ion-text-center ion-margin-top">
    <p style="font-size: 0.9em; color: gray;">
      Pas encore de compte ? <a (click)="navCtrl.navigateForward('/register')">S'inscrire</a>
    </p>
  </div>
</ion-content>
